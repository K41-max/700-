<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>English Learning Hub Pro</title>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --sidebar-active: #38bdf8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* GitHub風 サイドバー */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease;
      z-index: 100;
      border-right: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .sidebar.collapsed { margin-left: -280px; }

    .sidebar-header {
      padding: 16px 20px;
      font-weight: 700;
      font-size: 0.95rem;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e2e8f0;
    }

    .sidebar-content { padding: 16px; flex: 1; overflow-y: auto; }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--sidebar-text);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .file-list { list-style: none; margin-bottom: 20px; }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
      color: #cbd5e1;
      margin-bottom: 4px;
      transition: all 0.2s;
    }

    .file-item:hover { background: #1e293b; color: #fff; }
    .file-item.active { background: #1e293b; color: var(--sidebar-active); font-weight: 600; }
    .file-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }

    .btn-delete-file {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-delete-file:hover { color: #ef4444; background: #334155; }

    .sidebar-dropzone {
      border: 2px dashed #334155;
      border-radius: var(--radius-md);
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #0f172a;
    }
    .sidebar-dropzone:hover, .sidebar-dropzone.dragover { border-color: var(--primary); background: #1e293b; }
    .sidebar-dropzone p { font-size: 0.8rem; color: var(--sidebar-text); }

    /* メインエリア */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .toggle-sidebar-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-sidebar-btn:hover { background: #f1f5f9; }

    .container { max-width: 800px; width: 100%; margin: 0 auto; padding: 30px 20px; }

    /* タブ */
    .tabs { display: flex; background: #e2e8f0; padding: 4px; border-radius: var(--radius-md); margin-bottom: 24px; gap: 4px; }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-sm); }

    /* 設定カード */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .panel-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
    .setting-group { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .setting-item { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }

    select, input[type="number"] {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      outline: none;
      background: #fff;
    }

    /* 問題カード */
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      position: relative;
    }

    .q-badge-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .q-number { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: #e0e7ff; padding: 2px 8px; border-radius: 4px; }
    .wrong-badge { font-size: 0.75rem; font-weight: 700; color: #dc2626; background: #fef2f2; padding: 2px 8px; border-radius: 4px; }

    .ja-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    .en-text { font-size: 1.2rem; color: #334155; margin-bottom: 16px; font-weight: 500; }

    /* ボタン */
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button.btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    button.btn:hover { background: var(--primary-hover); }
    button.btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    button.btn-secondary:hover { background: #e2e8f0; }
    button.btn-danger { background: #ef4444; color: white; }

    /* 並び替えエリア */
    .word-pool, .answer-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 60px;
      padding: 12px;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      background: #f8fafc;
      align-items: center;
      transition: all 0.2s ease;
    }

    .answer-box { background: #fff; border-style: solid; border-color: #a5b4fc; }

    /* ドラッグホバー時の強調 */
    .word-pool.drag-over, .answer-box.drag-over {
      background: #eef2ff;
      border-color: var(--primary);
      transform: scale(1.01);
    }

    .word-btn {
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: grab;
      font-size: 0.95rem;
      font-weight: 500;
      user-select: none;
      touch-action: none; /* スクロールとドラッグの衝突回避 */
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, opacity 0.15s, background-color 0.15s;
    }

    .word-btn:active { cursor: grabbing; }

    .word-btn.dragging {
      opacity: 0.2;
      transform: scale(0.95);
    }

    .answer-box .word-btn { background: #e0e7ff; border-color: #c7d2fe; color: #3730a3; }

    /* 指ドラッグ中の追従ゴースト */
    .touch-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.9;
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      background: #4f46e5 !important;
      color: #fff !important;
      border-color: #4338ca !important;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 12px;
      outline: none;
    }
    textarea:focus { border-color: var(--primary); }

    .result-msg {
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    .result-msg.correct { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .result-msg.incorrect { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .empty-state { text-align: center; padding: 60px 20px; background: var(--card-bg); border-radius: var(--radius-lg); border: 1px dashed var(--border-color); }
  </style>
</head>
<body>

<!-- GitHub風 サイドバー -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>📂 Files Navigator</span>
  </div>
  <div class="sidebar-content">
    <div class="sidebar-title">読み込み済みファイル</div>
    <ul class="file-list" id="fileList"></ul>

    <div class="sidebar-title">ファイルを追加</div>
    <div class="sidebar-dropzone" id="sidebarDropzone">
      <p>ここにドラッグ＆ドロップ</p>
      <p style="font-size:0.7rem; margin-top:4px;">またはクリック (.json / .txt)</p>
      <input type="file" id="sidebarFileInput" accept=".json,.txt" style="display: none;">
    </div>
  </div>
</aside>

<!-- メインエリア -->
<div class="main-wrapper">
  <div class="top-bar">
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
      <span id="toggleIcon">◀</span> <span>ファイル整理</span>
    </button>
    <div style="font-weight: 600; font-size: 0.95rem;" id="currentFileNameDisplay">ファイルが選択されていません</div>
  </div>

  <div class="container">
    <div id="noDataState" class="empty-state">
      <h2>データファイルがありません</h2>
      <p style="color: var(--text-muted); margin: 12px 0 20px;">
        左側のサイドバーから `.json` または `.txt` ファイルを追加・選択してください。
      </p>
    </div>

    <div id="appContainer" style="display: none;">
      <!-- タブバー -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('memorize', event)">① 暗記 & 連続音声</button>
        <button class="tab-btn" onclick="switchTab('reorder', event)">② 並び替えテスト</button>
        <button class="tab-btn" onclick="switchTab('composition', event)">③ 英作文テスト</button>
      </div>

      <!-- ① 暗記タブ -->
      <div id="memorizeTab" class="tab-content">
        <div class="control-panel">
          <div class="panel-title">🎧 連続音声再生設定</div>
          <div class="setting-group">
            <div class="setting-item">
              <label>モード:</label>
              <select id="audioMode" onchange="toggleAudioModeInput()">
                <option value="loops">周数指定 (n周)</option>
                <option value="timer">時間指定 (○分間)</option>
              </select>
            </div>
            <div class="setting-item" id="loopInputGroup">
              <label>再生周数:</label>
              <input type="number" id="audioLoops" value="1" min="1" max="50" style="width: 70px;"> 周
            </div>
            <div class="setting-item" id="timerInputGroup" style="display: none;">
              <label>タイマー:</label>
              <input type="number" id="audioMinutes" value="5" min="1" max="180" style="width: 70px;"> 分
            </div>
            <button class="btn" id="playAudioBtn" onclick="toggleContinuousPlay()">▶ 連続再生を開始</button>
          </div>
          <div id="audioStatusMsg" style="font-size: 0.85rem; color: var(--primary); margin-top: 10px; font-weight: 600;"></div>
        </div>
        <div id="listContainer"></div>
      </div>

      <!-- ② 並び替えテストタブ -->
      <div id="reorderTab" class="tab-content" style="display: none;">
        <div class="control-panel">
          <div class="panel-title">⚙️ 出題設定</div>
          <div class="setting-group">
            <div class="setting-item">
              <label>問題数:</label>
              <select id="reorderCountSelect">
                <option value="5">5問</option>
                <option value="10" selected>10問</option>
                <option value="20">20問</option>
                <option value="all">フル (全問)</option>
              </select>
            </div>
            <div class="setting-item">
              <label>出題順:</label>
              <select id="reorderOrderSelect">
                <option value="order">順番通り</option>
                <option value="random">ランダム</option>
                <option value="review">復習優先 (苦手重視)</option>
              </select>
            </div>
            <button class="btn" onclick="startReorderSession()">テストを開始/リセット</button>
          </div>
        </div>

        <div class="card" id="reorderCard">
          <div class="q-badge-group">
            <span class="q-number" id="reorderNum">QUESTION</span>
            <span class="wrong-badge" id="reorderWrongBadge" style="display:none;"></span>
          </div>
          <div id="reorderJa" class="ja-text"></div>
          
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">💡 タップで素早く移動、長押しスワイプで自由に並び替えができます</div>
          
          <div id="answerBox" class="answer-box"></div>
          <div id="wordPool" class="word-pool"></div>

          <div class="btn-group">
            <button class="btn" onclick="checkReorder()">判定する</button>
            <button class="btn btn-secondary" onclick="nextReorderQuestion()">次の問題 →</button>
          </div>
          <div id="reorderResult" class="result-msg" style="display: none;"></div>
        </div>
      </div>

      <!-- ③ 英作文テストタブ -->
      <div id="compositionTab" class="tab-content" style="display: none;">
        <div class="control-panel">
          <div class="panel-title">⚙️ 出題設定</div>
          <div class="setting-group">
            <div class="setting-item">
              <label>問題数:</label>
              <select id="compCountSelect">
                <option value="5">5問</option>
                <option value="10" selected>10問</option>
                <option value="20">20問</option>
                <option value="all">フル (全問)</option>
              </select>
            </div>
            <div class="setting-item">
              <label>出題順:</label>
              <select id="compOrderSelect">
                <option value="order">順番通り</option>
                <option value="random">ランダム</option>
                <option value="review">復習優先 (苦手重視)</option>
              </select>
            </div>
            <button class="btn" onclick="startCompSession()">テストを開始/リセット</button>
          </div>
        </div>

        <div class="card" id="compCard">
          <div class="q-badge-group">
            <span class="q-number" id="compNum">QUESTION</span>
            <span class="wrong-badge" id="compWrongBadge" style="display:none;"></span>
          </div>
          <div id="compJa" class="ja-text"></div>
          <textarea id="compInput" rows="3" placeholder="英語で文を入力してください..."></textarea>
          <div class="btn-group">
            <button class="btn" onclick="checkComposition()">答え合わせ</button>
            <button class="btn btn-secondary" onclick="playAudio(activeSessionQuestions[compIndex].en)">🔊 音声を聞く</button>
            <button class="btn btn-secondary" onclick="nextCompQuestion()">次の問題 →</button>
          </div>
          <div id="compResult" class="result-msg" style="display: none;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // --- グローバル状態 ---
  let fileList = [];
  let activeFileId = null;
  let activeData = [];
  let statsData = JSON.parse(localStorage.getItem('english_app_stats') || '{}');

  // 音声状態
  let isPlayingContinuous = false;
  let speechUtterance = null;
  let continuousIndex = 0;
  let currentLoop = 1;
  let totalLoopsTarget = 1;
  let timerEndTime = null;

  // テスト状態
  let activeSessionQuestions = [];
  let reorderIndex = 0;
  let compIndex = 0;

  // 単語配列
  let poolWords = [];
  let selectedWords = [];

  // --- 初期化 ---
  const sidebarDropzone = document.getElementById('sidebarDropzone');
  const sidebarFileInput = document.getElementById('sidebarFileInput');

  sidebarDropzone.addEventListener('click', () => sidebarFileInput.click());
  sidebarDropzone.addEventListener('dragover', (e) => { e.preventDefault(); sidebarDropzone.classList.add('dragover'); });
  sidebarDropzone.addEventListener('dragleave', () => sidebarDropzone.classList.remove('dragover'));
  sidebarDropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    sidebarDropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files[0]);
  });
  sidebarFileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFileSelect(e.target.files[0]);
  });

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
    document.getElementById('toggleIcon').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
  }

  // --- ファイル管理 ---
  function handleFileSelect(file) {
    if (!file.name.endsWith('.json') && !file.name.endsWith('.txt')) {
      alert('JSON形式のファイル (.json / .txt) を指定してください。');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (Array.isArray(parsed) && parsed.length > 0) {
          const newFile = { id: 'file_' + Date.now(), name: file.name, data: parsed };
          fileList.push(newFile);
          activeFileId = newFile.id;
          renderFileList();
          loadActiveFileData();
        } else {
          alert('有効な問題データが見つかりませんでした。');
        }
      } catch (err) {
        alert('JSONファイルの読み込みに失敗しました。');
      }
    };
    reader.readAsText(file);
  }

  function renderFileList() {
    const container = document.getElementById('fileList');
    container.innerHTML = '';
    fileList.forEach(f => {
      const li = document.createElement('li');
      li.className = `file-item ${f.id === activeFileId ? 'active' : ''}`;
      li.onclick = () => { activeFileId = f.id; renderFileList(); loadActiveFileData(); };
      li.innerHTML = `
        <span class="file-item-name">📄 ${f.name}</span>
        <button class="btn-delete-file" title="削除" onclick="deleteFile('${f.id}', event)">✕</button>
      `;
      container.appendChild(li);
    });
  }

  function deleteFile(id, evt) {
    evt.stopPropagation();
    fileList = fileList.filter(f => f.id !== id);
    if (activeFileId === id) activeFileId = fileList.length ? fileList[0].id : null;
    renderFileList();
    loadActiveFileData();
  }

  function loadActiveFileData() {
    stopContinuousPlay();
    const currentFile = fileList.find(f => f.id === activeFileId);
    if (!currentFile) {
      document.getElementById('noDataState').style.display = 'block';
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('currentFileNameDisplay').innerText = 'ファイルが選択されていません';
      activeData = [];
      return;
    }
    document.getElementById('noDataState').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    document.getElementById('currentFileNameDisplay').innerText = `選択中: ${currentFile.name} (${currentFile.data.length}問)`;
    activeData = currentFile.data;
    renderMemorizeList();
    startReorderSession();
    startCompSession();
  }

  // --- スコア管理 ---
  function getStatKey(item) { return `${activeFileId}_${item.id}`; }
  function recordWrongAnswer(item) {
    const key = getStatKey(item);
    if (!statsData[key]) statsData[key] = { wrongCount: 0, lastWrong: 0 };
    statsData[key].wrongCount += 1;
    statsData[key].lastWrong = Date.now();
    localStorage.setItem('english_app_stats', JSON.stringify(statsData));
  }
  function getItemWrongCount(item) {
    const key = getStatKey(item);
    return statsData[key] ? statsData[key].wrongCount : 0;
  }

  function buildQuestionSet(countType, orderType) {
    let list = [...activeData];
    if (orderType === 'random') {
      list.sort(() => Math.random() - 0.5);
    } else if (orderType === 'review') {
      list.sort((a, b) => {
        const statA = statsData[getStatKey(a)] || { wrongCount: 0, lastWrong: 0 };
        const statB = statsData[getStatKey(b)] || { wrongCount: 0, lastWrong: 0 };
        if (statB.wrongCount !== statA.wrongCount) return statB.wrongCount - statA.wrongCount;
        return statB.lastWrong - statA.lastWrong;
      });
    }
    if (countType !== 'all') {
      list = list.slice(0, parseInt(countType, 10));
    }
    return list;
  }

  // --- タブ管理 ---
  function switchTab(tabName, evt) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    if (evt && evt.target) evt.target.classList.add('active');
    stopContinuousPlay();
    if (tabName === 'memorize') document.getElementById('memorizeTab').style.display = 'block';
    else if (tabName === 'reorder') document.getElementById('reorderTab').style.display = 'block';
    else if (tabName === 'composition') document.getElementById('compositionTab').style.display = 'block';
  }

  // --- ① 暗記 & 音声 ---
  function renderMemorizeList() {
    const container = document.getElementById('listContainer');
    container.innerHTML = '';
    activeData.forEach(item => {
      const wrongCount = getItemWrongCount(item);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="q-badge-group">
          <span class="q-number">No.${item.id}</span>
          ${wrongCount > 0 ? `<span class="wrong-badge">ミス: ${wrongCount}回</span>` : ''}
        </div>
        <div class="ja-text">${item.ja}</div>
        <div class="en-text">${item.en}</div>
        <button class="btn btn-secondary" onclick="playAudio('${item.en.replace(/'/g, "\\'")}')">🔊 単体再生</button>
      `;
      container.appendChild(card);
    });
  }

  function toggleAudioModeInput() {
    const mode = document.getElementById('audioMode').value;
    document.getElementById('loopInputGroup').style.display = mode === 'loops' ? 'flex' : 'none';
    document.getElementById('timerInputGroup').style.display = mode === 'timer' ? 'flex' : 'none';
  }

  function toggleContinuousPlay() {
    if (isPlayingContinuous) stopContinuousPlay();
    else startContinuousPlay();
  }

  function startContinuousPlay() {
    if (!activeData.length) return;
    isPlayingContinuous = true;
    continuousIndex = 0;
    currentLoop = 1;

    const mode = document.getElementById('audioMode').value;
    if (mode === 'loops') {
      totalLoopsTarget = parseInt(document.getElementById('audioLoops').value, 10) || 1;
      timerEndTime = null;
    } else {
      const mins = parseFloat(document.getElementById('audioMinutes').value) || 5;
      timerEndTime = Date.now() + mins * 60 * 1000;
      totalLoopsTarget = null;
    }

    document.getElementById('playAudioBtn').innerText = '⏹ 再生を停止';
    document.getElementById('playAudioBtn').classList.add('btn-danger');
    playNextContinuousSentence();
  }

  function stopContinuousPlay() {
    isPlayingContinuous = false;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.getElementById('playAudioBtn').innerText = '▶ 連続再生を開始';
    document.getElementById('playAudioBtn').classList.remove('btn-danger');
    document.getElementById('audioStatusMsg').innerText = '';
  }

  function playNextContinuousSentence() {
    if (!isPlayingContinuous) return;
    if (timerEndTime && Date.now() >= timerEndTime) {
      document.getElementById('audioStatusMsg').innerText = '⏱ 設定時間が経過したためきりの良いところで終了しました。';
      stopContinuousPlay();
      return;
    }
    if (continuousIndex >= activeData.length) {
      if (totalLoopsTarget && currentLoop >= totalLoopsTarget) {
        document.getElementById('audioStatusMsg').innerText = `✅ 指定の ${totalLoopsTarget} 周の再生が完了しました。`;
        stopContinuousPlay();
        return;
      }
      currentLoop++;
      continuousIndex = 0;
    }

    const item = activeData[continuousIndex];
    document.getElementById('audioStatusMsg').innerText = timerEndTime 
      ? `再生中... (${continuousIndex + 1}/${activeData.length}問目)`
      : `再生中... ${currentLoop}周目 (${continuousIndex + 1}/${activeData.length}問目)`;

    speechUtterance = new SpeechSynthesisUtterance(item.en);
    speechUtterance.lang = 'en-US';
    speechUtterance.rate = 0.9;
    speechUtterance.onend = () => { continuousIndex++; playNextContinuousSentence(); };
    speechUtterance.onerror = () => stopContinuousPlay();
    window.speechSynthesis.speak(speechUtterance);
  }

  function playAudio(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = 0.9;
      window.speechSynthesis.speak(uttr);
    }
  }

  // --- ② 並び替えテスト（タップ＆指ドラッグ自動判定） ---
  let activeDragInfo = null;
  let touchGhost = null;

  function startReorderSession() {
    const countType = document.getElementById('reorderCountSelect').value;
    const orderType = document.getElementById('reorderOrderSelect').value;
    activeSessionQuestions = buildQuestionSet(countType, orderType);
    reorderIndex = 0;
    loadReorderQuestion();
  }

  function loadReorderQuestion() {
    if (!activeSessionQuestions.length) return;
    const q = activeSessionQuestions[reorderIndex];
    const wrongCount = getItemWrongCount(q);

    document.getElementById('reorderNum').innerText = `QUESTION ${reorderIndex + 1} / ${activeSessionQuestions.length}`;
    const badge = document.getElementById('reorderWrongBadge');
    if (wrongCount > 0) { badge.style.display = 'inline'; badge.innerText = `ミス: ${wrongCount}回`; }
    else { badge.style.display = 'none'; }

    document.getElementById('reorderJa').innerText = q.ja;
    document.getElementById('reorderResult').style.display = 'none';

    const words = q.en.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(" ");
    poolWords = [...words].sort(() => Math.random() - 0.5);
    selectedWords = [];

    renderReorderUI();
  }

  function renderReorderUI() {
    renderWordPool();
    renderAnswerBox();
  }

  function renderWordPool() {
    const pool = document.getElementById('wordPool');
    pool.innerHTML = '';
    poolWords.forEach((word, idx) => {
      const btn = createWordButton(word, 'pool', idx);
      pool.appendChild(btn);
    });
  }

  function renderAnswerBox() {
    const box = document.getElementById('answerBox');
    box.innerHTML = '';
    selectedWords.forEach((word, idx) => {
      const btn = createWordButton(word, 'answer', idx);
      box.appendChild(btn);
    });
  }

  // タップとドラッグを高度に自動判定するボタン作成
  function createWordButton(word, source, index) {
    const btn = document.createElement('button');
    btn.className = 'word-btn';
    btn.innerText = word;
    btn.dataset.source = source;
    btn.dataset.index = index;
    btn.draggable = true;

    // 移動ロジック
    const doMove = () => {
      if (source === 'pool') {
        const moved = poolWords.splice(index, 1)[0];
        selectedWords.push(moved);
      } else {
        const moved = selectedWords.splice(index, 1)[0];
        poolWords.push(moved);
      }
      renderReorderUI();
    };

    // --- PC用 クリック判定 ---
    btn.addEventListener('click', (e) => {
      // タッチからの偽click（発火重複）を防止
      if (e.detail === 0 || btn.dataset.touchHandled === 'true') {
        delete btn.dataset.touchHandled;
        return;
      }
      doMove();
    });

    // --- PC用 ドラッグ判定 ---
    btn.addEventListener('dragstart', (e) => {
      activeDragInfo = { source, index };
      btn.classList.add('dragging');
      e.dataTransfer.setData('text/plain', JSON.stringify(activeDragInfo));
    });

    btn.addEventListener('dragend', () => {
      btn.classList.remove('dragging');
      activeDragInfo = null;
    });

    // --- スマホ用 タッチ処理 (タップ / ドラッグの完全自動切り替え) ---
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    btn.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      isDragging = false;
      activeDragInfo = { source, index };
    }, { passive: true });

    btn.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      // 10px以上動いた時だけ「ドラッグ操作」とみなす
      if (!isDragging && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
        isDragging = true;
        btn.classList.add('dragging');

        // ドラッグ中のゴースト生成
        touchGhost = btn.cloneNode(true);
        touchGhost.classList.add('touch-ghost');
        document.body.appendChild(touchGhost);
      }

      if (isDragging && touchGhost) {
        if (e.cancelable) e.preventDefault(); // 画面スクロール停止
        updateGhostPos(touch);
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        highlightDropZone(targetEl);
      }
    }, { passive: false });

    btn.addEventListener('touchend', (e) => {
      if (isDragging) {
        // ドラッグして放した場合
        const touch = e.changedTouches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        removeGhost();
        btn.classList.remove('dragging');
        clearDropHighlights();

        if (targetEl && activeDragInfo) {
          executeDrop(targetEl, activeDragInfo);
        }
      } else {
        // あまり動いていなければ「タップ」とみなす
        btn.dataset.touchHandled = 'true';
        removeGhost();
        doMove();
      }
      activeDragInfo = null;
    });

    return btn;
  }

  function updateGhostPos(touch) {
    if (!touchGhost) return;
    touchGhost.style.left = (touch.clientX - 35) + 'px';
    touchGhost.style.top = (touch.clientY - 20) + 'px';
  }

  function removeGhost() {
    if (touchGhost && touchGhost.parentNode) {
      touchGhost.parentNode.removeChild(touchGhost);
    }
    touchGhost = null;
  }

  function setupContainerEvents(containerId) {
    const container = document.getElementById(containerId);
    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      container.classList.add('drag-over');
    });
    container.addEventListener('dragleave', () => {
      container.classList.remove('drag-over');
    });
    container.addEventListener('drop', (e) => {
      e.preventDefault();
      container.classList.remove('drag-over');
      if (activeDragInfo) {
        executeDrop(e.target, activeDragInfo);
      }
    });
  }

  setupContainerEvents('answerBox');
  setupContainerEvents('wordPool');

  function highlightDropZone(targetEl) {
    clearDropHighlights();
    if (!targetEl) return;
    const box = targetEl.closest('#answerBox, #wordPool');
    if (box) box.classList.add('drag-over');
  }

  function clearDropHighlights() {
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  }

  function executeDrop(targetEl, dragInfo) {
    const targetBox = targetEl.closest('#answerBox, #wordPool');
    const targetBtn = targetEl.closest('.word-btn');

    if (!targetBox && !targetBtn) return;

    let word = null;
    if (dragInfo.source === 'pool') {
      word = poolWords.splice(dragInfo.index, 1)[0];
    } else {
      word = selectedWords.splice(dragInfo.index, 1)[0];
    }

    if (targetBtn && targetBtn.dataset) {
      const toSource = targetBtn.dataset.source;
      const toIndex = parseInt(targetBtn.dataset.index, 10);
      
      if (toSource === 'answer') {
        selectedWords.splice(toIndex, 0, word);
      } else {
        poolWords.splice(toIndex, 0, word);
      }
    } else if (targetBox) {
      if (targetBox.id === 'answerBox') {
        selectedWords.push(word);
      } else {
        poolWords.push(word);
      }
    }

    renderReorderUI();
  }

  function checkReorder() {
    const q = activeSessionQuestions[reorderIndex];
    const target = q.en.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").toLowerCase();
    const userAns = selectedWords.join(" ").toLowerCase();
    const resDiv = document.getElementById('reorderResult');
    resDiv.style.display = 'block';

    if (target === userAns) {
      resDiv.className = 'result-msg correct';
      resDiv.innerText = '⭕️ 正解です！';
      playAudio(q.en);
    } else {
      resDiv.className = 'result-msg incorrect';
      resDiv.innerText = `❌ 不正解... 正解:\n${q.en}`;
      recordWrongAnswer(q);
    }
  }

  function nextReorderQuestion() {
    if (reorderIndex + 1 < activeSessionQuestions.length) {
      reorderIndex++;
      loadReorderQuestion();
    } else {
      alert('テスト終了です！お疲れ様でした。');
      startReorderSession();
    }
  }

  // --- ③ 英作文テスト ---
  function startCompSession() {
    const countType = document.getElementById('compCountSelect').value;
    const orderType = document.getElementById('compOrderSelect').value;
    activeSessionQuestions = buildQuestionSet(countType, orderType);
    compIndex = 0;
    loadCompQuestion();
  }

  function loadCompQuestion() {
    if (!activeSessionQuestions.length) return;
    const q = activeSessionQuestions[compIndex];
    const wrongCount = getItemWrongCount(q);

    document.getElementById('compNum').innerText = `QUESTION ${compIndex + 1} / ${activeSessionQuestions.length}`;
    const badge = document.getElementById('compWrongBadge');
    if (wrongCount > 0) { badge.style.display = 'inline'; badge.innerText = `ミス: ${wrongCount}回`; }
    else { badge.style.display = 'none'; }

    document.getElementById('compJa').innerText = q.ja;
    document.getElementById('compInput').value = '';
    document.getElementById('compResult').style.display = 'none';
  }

  function checkComposition() {
    const q = activeSessionQuestions[compIndex];
    const userVal = document.getElementById('compInput').value.trim().toLowerCase();
    const targetVal = q.en.trim().toLowerCase();
    const resDiv = document.getElementById('compResult');
    resDiv.style.display = 'block';

    if (userVal === targetVal) {
      resDiv.className = 'result-msg correct';
      resDiv.innerText = '⭕️ 正解！素晴らしいです。';
      playAudio(q.en);
    } else {
      resDiv.className = 'result-msg incorrect';
      resDiv.innerText = `❌ 惜しい！ 正解:\n${q.en}`;
      recordWrongAnswer(q);
    }
  }

  function nextCompQuestion() {
    if (compIndex + 1 < activeSessionQuestions.length) {
      compIndex++;
      loadCompQuestion();
    } else {
      alert('英作文テスト終了です！お疲れ様でした。');
      startCompSession();
    }
  }
</script>
